<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YQN 仓储运营平台</title>
  <link rel="stylesheet" href="entry.css">
</head>
<body data-phase="idle" data-page="login">
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="warehouse-icon" viewBox="0 0 24 24"><path d="m3 9 9-6 9 6v12H3Z M7 21V10h10v11 M9 13h6 M9 16h6 M9 19h6"/></symbol>
    <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="user-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="lock-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3 M12 14v3"/></symbol>
    <symbol id="eye-icon" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs></svg>
  <div id="portal">
    <header class="topbar">
      <div class="brand"><svg aria-hidden="true"><use href="#warehouse-icon"/></svg><strong>YQN 仓储运营平台</strong><span class="brand-scope">多仓运营平台</span></div>
      <nav class="header-actions" aria-label="平台操作">
        <button id="logout-button" class="header-button" hidden>返回登录</button>
      </nav>
    </header>
    <main class="pages">
      <section id="login-page" class="login-page" aria-labelledby="login-title">
        <div class="login-visual"><img src="assets/entry-hero.png" alt="多仓数字孪生平台主视觉" fetchpriority="high"></div>
        <div class="login-sidebar">
          <div class="login-welcome"><h1 id="login-title" tabindex="-1">企业账号登录</h1></div>
          <form id="login-form" autocomplete="off" novalidate>
            <label class="field-label" for="company-account">企业账号</label>
            <div class="input-frame"><svg aria-hidden="true"><use href="#user-icon"/></svg><input id="company-account" type="text" autocomplete="off" placeholder="请输入企业账号（选填）" maxlength="100" spellcheck="false"></div>
            <label class="field-label password-label" for="company-password">密码</label>
            <div class="input-frame"><svg aria-hidden="true"><use href="#lock-icon"/></svg><input id="company-password" type="password" autocomplete="new-password" placeholder="请输入密码（选填）" maxlength="100"><button id="password-toggle" class="icon-button" type="button" aria-label="显示密码" aria-pressed="false"><svg aria-hidden="true"><use href="#eye-icon"/></svg></button></div>
            <button id="login-button" class="button primary" type="submit"><span>登录</span><svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
          </form>
          <div class="login-footer">YQN 仓储运营平台</div>
        </div>
      </section>
      <section id="warehouse-page" class="warehouse-page" aria-labelledby="warehouse-title" hidden inert>
        <div class="page-heading"><h1 id="warehouse-title" tabindex="-1">选择仓库</h1></div>
        <div class="warehouse-toolbar">
          <div class="catalog-tab">全部仓库 <span id="warehouse-count">0</span></div>
          <div class="filters"><label class="search-box"><svg aria-hidden="true"><use href="#search-icon"/></svg><input id="warehouse-search" type="search" placeholder="搜索仓库名称或地址" aria-label="搜索仓库名称或地址" autocomplete="off" maxlength="128"></label><select id="warehouse-region" aria-label="筛选地区"><option value="">全部地区</option></select></div>
        </div>
        <div id="entry-notice" class="entry-notice" role="status" aria-live="polite" hidden><span id="entry-notice-text"></span><button id="entry-retry" class="text-button" hidden>重试进入</button></div>
        <div id="warehouse-list" class="warehouse-grid" aria-label="可进入的仓库"></div>
        <p id="empty-state" class="empty-state" role="status" hidden>没有找到匹配的仓库。</p>
        <p id="catalog-status" class="catalog-status" role="status">正在读取仓库目录…</p>
      </section>
    </main>
  </div>
  <button id="back-button" class="back-button" data-in-header="false" hidden><span aria-hidden="true">←</span> 返回仓库选择</button>
  <script src="globe-policy.js"></script><script src="entry-policy.js"></script><script src="entry.js"></script>
</body>
</html>
